# Builds the site and publishes dist/ to the gh-pages branch, which GitHub Pages
# serves at www.nicholashillengas.com. Runs only for plain version tags (v1.2.3).
#
#   git tag -a v1.2.3 -m "..."
#   git push origin v1.2.3
#
# Pages setting required: Source = Deploy from a branch -> gh-pages / (root)
name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # push to the gh-pages branch

# Don't let two releases deploy at the same time; let an in-progress deploy finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Commits dist/ (including public/CNAME) to gh-pages and adds .nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          commit_message: 'Deploy ${{ github.ref_name }}'
